name: release

# Triggered by pushing a tag matching `suwappu-dag-v*`. Builds release
# binaries for 3 targets and uploads them as GitHub Release assets so
# external developers can `gh release download` without compiling from
# source.
#
# Matrix:
#   - linux-x86_64-musl     (ubuntu-latest + musl-tools)
#   - linux-aarch64-gnu     (ubuntu-24.04-arm — GitHub-hosted Graviton runner)
#   - macos-x86_64          (macos-13, Intel)
#   - macos-aarch64         (macos-14, Apple Silicon)
#
# `aarch64-unknown-linux-gnu` is now first-class because the testnet
# seed cluster runs `c7g.xlarge` (Graviton 3) and external operators on
# arm64 Linux hardware need the binary published per
# `docs/testnet/VALIDATOR-OPERATORS.md`. We use the native ARM runner
# (GA on GitHub since 2025) instead of `cross` because pqcrypto-mldsa's
# pq-clean C code has historically misbehaved under cross-compile, and
# the runner is free for public repos.
#
# Binaries shipped per platform:
#   - suwappu-node              (validator daemon)
#   - suwappu-loadgen           (load generator + LoadGenClient CLI helper)
#   - suwappu-metrics           (post-hoc event-log analyzer)
#   - suwappu-indexer           (streaming indexer with HTTP read API)
#   - suwappu-faucet            (devnet/testnet faucet HTTP service)
#   - suwappu-validator-program (testnet points-accumulator daemon —
#                            foundation-side; published so the
#                            operator-program EC2 can pull it on
#                            bootstrap)
#
# Each platform's binaries are tarballed and uploaded with a SHA256
# checksum. The Release page collects all platform tarballs plus a
# combined SHA256SUMS file.

on:
  push:
    tags:
      - 'suwappu-dag-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. suwappu-dag-v0.1.0). Requires the tag to already exist.'
        required: true

permissions:
  contents: write  # required to upload Release assets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Private git dep `gsxdb-bridge` requires the deploy key — same
      # pattern as docs.yml. Cargo will pull from a different repo
      # otherwise and fail with "Repository not found".
      - name: Setup suwappu-db deploy key
        env:
          SUWAPPU_DB_DEPLOY_KEY: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SUWAPPU_DB_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Rewrite https://github.com → git@github.com for cargo
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (linux only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build the binaries that have crate-level `[[bin]]` entries.
      #
      # NOTE on suwappu-loadgen / suwappu-metrics: these are NOT standalone
      # packages — they are `[[bin]]` targets *of the suwappu-node package*
      # (see crates/suwappu-node/Cargo.toml). `--bins` builds every bin
      # target of each selected `-p` package, so `-p suwappu-node --bins`
      # already emits suwappu-node, suwappu-loadgen, and suwappu-metrics into
      # target/<target>/release/, where the Package step picks them up.
      # Do NOT add `-p suwappu-loadgen` / `-p suwappu-metrics`: cargo fails with
      # "package ID specification `suwappu-loadgen` did not match any
      # packages" because no such package exists. There are likewise no
      # crates/suwappu-loadgen or crates/suwappu-metrics dirs to gate on.
      #
      # suwappu-faucet IS a standalone package (crates/suwappu-faucet) and is
      # optional — gate on its crate dir existing so this workflow
      # doesn't break before G3 lands.
      #
      # Releases cannot actually run yet: GitHub Actions billing has been
      # blocked since 2026-05-18 (#227), so no tag push will start this
      # job until billing is restored.
      - name: cargo build --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          CRATES="-p suwappu-node -p suwappu-indexer"
          if [ -d crates/suwappu-faucet ]; then
            CRATES="$CRATES -p suwappu-faucet"
          fi
          if [ -d crates/suwappu-validator-program ]; then
            CRATES="$CRATES -p suwappu-validator-program"
          fi
          cargo build --release --target ${{ matrix.target }} $CRATES \
              --bins

      - name: Package
        id: pkg
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TARGET="${{ matrix.target }}"
          STAGING="suwappu-dag-${TAG#suwappu-dag-}-${TARGET}"
          mkdir -p "$STAGING"

          # Collect every suwappu-* binary cargo emitted. Filters out
          # libraries, build artifacts, and the non-suwappu side products
          # (e.g. ureq's bundled binaries).
          BIN_DIR="target/${TARGET}/release"
          for b in suwappu-node suwappu-loadgen suwappu-metrics suwappu-indexer suwappu-faucet suwappu-validator-program; do
            if [ -f "$BIN_DIR/$b" ]; then
              cp "$BIN_DIR/$b" "$STAGING/$b"
              chmod +x "$STAGING/$b"
              echo "packaged: $b"
            fi
          done

          # Bundle a minimal README inside the tarball so the unzipped
          # directory is self-documenting.
          cat > "$STAGING/README.txt" <<EOF
          suwappu-dag ${TAG} — ${TARGET}

          Binaries in this archive:
          $(ls "$STAGING" | grep -v README.txt | sed 's/^/  /')

          Quick start (against the public devnet):
            ./suwappu-node --help
            ./suwappu-loadgen --help
            ./suwappu-indexer --help

          See:
            https://github.com/suwappu/suwappu-dag
            DEVNET.md for the public devnet RPC URL.
          EOF

          tar -czf "${STAGING}.tar.gz" "$STAGING"
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          echo "archive=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${STAGING}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.checksum }}

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Build combined SHA256SUMS
        run: |
          cd artifacts
          ls *.tar.gz | sort | xargs shasum -a 256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#suwappu-dag-}"

          # Generate a default release body from the CHANGELOG section
          # for this version, if it exists; otherwise from the tag
          # annotation; otherwise minimal.
          BODY_FILE=$(mktemp)
          if [ -f CHANGELOG.md ] && grep -q "^## ${VERSION}$" CHANGELOG.md; then
            awk "/^## ${VERSION}$/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > "$BODY_FILE"
          else
            echo "suwappu-dag ${VERSION}" > "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo "Binaries: see assets below. Source: \`git checkout ${TAG}\`." >> "$BODY_FILE"
          fi

          gh release create "$TAG" \
            --title "suwappu-dag $VERSION" \
            --notes-file "$BODY_FILE" \
            --verify-tag \
            ./artifacts/*.tar.gz \
            ./artifacts/SHA256SUMS
