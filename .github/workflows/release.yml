name: release

# Triggered by pushing a tag matching `suwappu-dag-v*`. Builds release
# binaries for 3 targets and uploads them as GitHub Release assets so
# external developers can `gh release download` without compiling from
# source.
#
# Matrix:
#   - linux-x86_64-musl  (ubuntu-latest + musl-tools)
#   - macos-x86_64       (macos-13, Intel)
#   - macos-aarch64      (macos-14, Apple Silicon)
#
# Targets NOT in the matrix:
#   - linux-aarch64-musl — needs `cross` or a Graviton runner; deferred
#     until there's demand. Linux x86_64 musl covers >95% of devs.
#
# Binaries shipped per platform:
#   - suwappu-node      (validator daemon)
#   - suwappu-loadgen   (load generator + LoadGenClient CLI helper)
#   - suwappu-metrics   (post-hoc event-log analyzer)
#   - suwappu-indexer   (streaming indexer with HTTP read API)
#   - suwappu-keygen    (ML-DSA/BLS keypair generator, from suwappu-crypto)
#   - suwappu-validator-program (testnet points-accumulator daemon)
#   - suwappu-faucet    (devnet faucet HTTP service — landed in G3; the
#                    release workflow attempts to build it and skips
#                    silently if the crate doesn't exist yet)
#
# Each platform's binaries are tarballed and uploaded with a SHA256
# checksum. The Release page collects all platform tarballs plus a
# combined SHA256SUMS file.

on:
  push:
    tags:
      - 'suwappu-dag-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. suwappu-dag-v0.1.0). Requires the tag to already exist.'
        required: true

permissions:
  contents: write  # required to upload Release assets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Private git dep `suwappudb-bridge` requires the deploy key — same
      # pattern as docs.yml. Cargo will pull from a different repo
      # otherwise and fail with "Repository not found".
      - name: Setup suwappu-db deploy key
        env:
          SUWAPPU_DB_DEPLOY_KEY: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SUWAPPU_DB_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Rewrite https://github.com → git@github.com for cargo
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (linux only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build the binaries that have crate-level `[[bin]]` entries.
      # suwappu-faucet is optional — gate on its crate existing so this
      # workflow doesn't break before G3 lands.
      - name: cargo build --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          CRATES="-p suwappu-node -p suwappu-indexer -p suwappu-crypto -p suwappu-validator-program"
          if [ -d crates/suwappu-faucet ]; then
            CRATES="$CRATES -p suwappu-faucet"
          fi
          cargo build --release --target ${{ matrix.target }} $CRATES \
              --bins

      - name: Package
        id: pkg
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TARGET="${{ matrix.target }}"
          STAGING="suwappu-dag-${TAG#suwappu-dag-}-${TARGET}"
          mkdir -p "$STAGING"

          # Collect every suwappu-* binary cargo emitted. Filters out
          # libraries, build artifacts, and the non-suwappu side products
          # (e.g. ureq's bundled binaries).
          BIN_DIR="target/${TARGET}/release"
          for b in suwappu-node suwappu-loadgen suwappu-metrics suwappu-indexer suwappu-keygen suwappu-validator-program suwappu-faucet; do
            if [ -f "$BIN_DIR/$b" ]; then
              cp "$BIN_DIR/$b" "$STAGING/$b"
              chmod +x "$STAGING/$b"
              echo "packaged: $b"
            fi
          done

          # Bundle a minimal README inside the tarball so the unzipped
          # directory is self-documenting.
          cat > "$STAGING/README.txt" <<EOF
          suwappu-dag ${TAG} — ${TARGET}

          Binaries in this archive:
          $(ls "$STAGING" | grep -v README.txt | sed 's/^/  /')

          Quick start (against the public devnet):
            ./suwappu-node --help
            ./suwappu-loadgen --help
            ./suwappu-indexer --help

          See:
            https://github.com/Suwappu-Labs/suwappu-dag
            DEVNET.md for the public devnet RPC URL.
          EOF

          tar -czf "${STAGING}.tar.gz" "$STAGING"
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          echo "archive=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${STAGING}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.checksum }}

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Build combined SHA256SUMS
        run: |
          cd artifacts
          ls *.tar.gz | sort | xargs shasum -a 256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#suwappu-dag-}"

          # Generate a default release body from the CHANGELOG section
          # for this version, if it exists; otherwise from the tag
          # annotation; otherwise minimal.
          BODY_FILE=$(mktemp)
          if [ -f CHANGELOG.md ] && grep -q "^## ${VERSION}$" CHANGELOG.md; then
            awk "/^## ${VERSION}$/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > "$BODY_FILE"
          else
            echo "suwappu-dag ${VERSION}" > "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo "Binaries: see assets below. Source: \`git checkout ${TAG}\`." >> "$BODY_FILE"
          fi

          gh release create "$TAG" \
            --title "suwappu-dag $VERSION" \
            --notes-file "$BODY_FILE" \
            --verify-tag \
            ./artifacts/*.tar.gz \
            ./artifacts/SHA256SUMS
