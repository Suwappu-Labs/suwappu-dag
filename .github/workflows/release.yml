name: release

# Triggered by pushing a tag matching `suwappu-dag-v*`. Builds release
# binaries for 3 targets and uploads them as GitHub Release assets so
# external developers can `gh release download` without compiling from
# source.
#
# Matrix:
#   - linux-x86_64-gnu    (ubuntu-latest)
#   - linux-aarch64-gnu   (ubuntu-latest, cross-compiled — for the Oracle
#                          Free Ampere A1 ARM testnet host; glibc target
#                          matches Oracle's Ubuntu/Oracle-Linux images)
#   - macos-x86_64        (macos-13, Intel)
#   - macos-aarch64       (macos-14, Apple Silicon)
#
# Why glibc and not musl for the x86_64 Linux leg: the musl target does
# not build, and never did (this workflow had never been run before
# 2026-08-15). Two independent blockers, verified locally:
#   1. PQClean's `common/compat.h` guards a pre-GCC-7.1 AVX polyfill with
#      `__GNUC_PREREQ(7, 1)`, which is a glibc <features.h> macro that musl
#      does not define — the preprocessor then errors with "missing binary
#      operator before token '('" while building pqcrypto-mlkem.
#   2. Behind that, `openssl-sys` needs a musl-linked OpenSSL, i.e. we would
#      have to vendor and build OpenSSL from source.
# Clearing those would mean patching a PQ crypto dependency's C build and
# vendoring OpenSSL, purely to gain static linking. Not worth it on a chain
# whose crypto surface is load-bearing. Both glibc legs are verified to
# produce all 7 binaries. Do NOT "restore" the musl target without
# re-checking both blockers above.
#
# glibc floor: binaries are built on `ubuntu-latest` and therefore require
# that runner's glibc or newer on the target host. Deploy onto an Ubuntu
# release at least as new as the builder (see docs/testnet/NON-AWS-DEPLOY.md).
# If an older floor is ever needed, pin the two Linux legs to an older
# `runs-on` image rather than switching back to musl.
#
# The arm64 leg cross-compiles on the standard x86 runner: cargo runs on
# the host (so the private suwappu-db SSH fetch works exactly like the
# x86 job), and only the linker + C compilers (for the blst / pqcrypto C
# deps) are cross via gcc-aarch64-linux-gnu. This keeps the build free
# (no native ARM runner, which is billed on private repos).
#
# Binaries shipped per platform:
#   - suwappu-node      (validator daemon)
#   - suwappu-loadgen   (load generator + LoadGenClient CLI helper)
#   - suwappu-metrics   (post-hoc event-log analyzer)
#   - suwappu-indexer   (streaming indexer with HTTP read API)
#   - suwappu-keygen    (ML-DSA/BLS keypair generator, from suwappu-crypto)
#   - suwappu-validator-program (testnet points-accumulator daemon)
#   - suwappu-faucet    (devnet faucet HTTP service — landed in G3; the
#                    release workflow attempts to build it and skips
#                    silently if the crate doesn't exist yet)
#
# Each platform's binaries are tarballed and uploaded with a SHA256
# checksum. The Release page collects all platform tarballs plus a
# combined SHA256SUMS file.

on:
  push:
    tags:
      - 'suwappu-dag-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. suwappu-dag-v0.1.0). Requires the tag to already exist.'
        required: true

permissions:
  contents: write  # required to upload Release assets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Private git dep `suwappudb-bridge` requires the deploy key — same
      # pattern as docs.yml. Cargo will pull from a different repo
      # otherwise and fail with "Repository not found".
      - name: Setup suwappu-db deploy key
        env:
          SUWAPPU_DB_DEPLOY_KEY: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SUWAPPU_DB_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Rewrite https://github.com → git@github.com for cargo
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain (linux arm64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build the binaries that have crate-level `[[bin]]` entries.
      # suwappu-faucet is optional — gate on its crate existing so this
      # workflow doesn't break before G3 lands.
      #
      # The arm64 cross env vars are target-suffixed, so they are inert
      # for the other three targets and safe to set unconditionally: they
      # only take effect when building aarch64-unknown-linux-gnu (linker +
      # the `cc` crate's C compiler for blst / pqcrypto).
      - name: cargo build --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: |
          CRATES="-p suwappu-node -p suwappu-indexer -p suwappu-crypto -p suwappu-validator-program"
          if [ -d crates/suwappu-faucet ]; then
            CRATES="$CRATES -p suwappu-faucet"
          fi
          cargo build --release --target ${{ matrix.target }} $CRATES \
              --bins

      - name: Package
        id: pkg
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TARGET="${{ matrix.target }}"
          STAGING="suwappu-dag-${TAG#suwappu-dag-}-${TARGET}"
          mkdir -p "$STAGING"

          # Collect every suwappu-* binary cargo emitted. Filters out
          # libraries, build artifacts, and the non-suwappu side products
          # (e.g. ureq's bundled binaries).
          BIN_DIR="target/${TARGET}/release"
          for b in suwappu-node suwappu-loadgen suwappu-metrics suwappu-indexer suwappu-keygen suwappu-validator-program suwappu-faucet; do
            if [ -f "$BIN_DIR/$b" ]; then
              cp "$BIN_DIR/$b" "$STAGING/$b"
              chmod +x "$STAGING/$b"
              echo "packaged: $b"
            fi
          done

          # Fail loudly on an incomplete tarball. The copy loop above skips
          # anything missing, so without this check a partially-built target
          # would publish a half-empty archive that looks successful — the
          # exact shape of "silent truncation" we want to avoid on a release
          # artifact operators depend on. suwappu-faucet stays optional
          # (gated on its crate existing); the other six are mandatory.
          MISSING=""
          for b in suwappu-node suwappu-loadgen suwappu-metrics suwappu-indexer suwappu-keygen suwappu-validator-program; do
            [ -f "$STAGING/$b" ] || MISSING="$MISSING $b"
          done
          if [ -d crates/suwappu-faucet ] && [ ! -f "$STAGING/suwappu-faucet" ]; then
            MISSING="$MISSING suwappu-faucet(crate present but binary absent)"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::${TARGET}: expected binaries missing from the archive:$MISSING"
            exit 1
          fi

          # Bundle a minimal README inside the tarball so the unzipped
          # directory is self-documenting.
          cat > "$STAGING/README.txt" <<EOF
          suwappu-dag ${TAG} — ${TARGET}

          Binaries in this archive:
          $(ls "$STAGING" | grep -v README.txt | sed 's/^/  /')

          Quick start (against the public devnet):
            ./suwappu-node --help
            ./suwappu-loadgen --help
            ./suwappu-indexer --help

          See:
            https://github.com/Suwappu-Labs/suwappu-dag
            DEVNET.md for the public devnet RPC URL.
          EOF

          tar -czf "${STAGING}.tar.gz" "$STAGING"
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          echo "archive=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${STAGING}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.checksum }}

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Build combined SHA256SUMS
        run: |
          cd artifacts
          ls *.tar.gz | sort | xargs shasum -a 256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#suwappu-dag-}"

          # Generate a default release body from the CHANGELOG section
          # for this version, if it exists; otherwise from the tag
          # annotation; otherwise minimal.
          BODY_FILE=$(mktemp)
          if [ -f CHANGELOG.md ] && grep -q "^## ${VERSION}$" CHANGELOG.md; then
            awk "/^## ${VERSION}$/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > "$BODY_FILE"
          else
            echo "suwappu-dag ${VERSION}" > "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo "Binaries: see assets below. Source: \`git checkout ${TAG}\`." >> "$BODY_FILE"
          fi

          gh release create "$TAG" \
            --title "suwappu-dag $VERSION" \
            --notes-file "$BODY_FILE" \
            --verify-tag \
            ./artifacts/*.tar.gz \
            ./artifacts/SHA256SUMS
