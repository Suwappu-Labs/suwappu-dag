name: explorer-testnet

# Deploy the suwappu-testnet block explorer SPA to S3 + invalidate
# CloudFront. Fork of explorer.yml (devnet) — same job shape,
# bakes the testnet RPC URL at build time, targets the testnet
# bucket + CloudFront distribution.
#
# Pre-reqs (one-time, set by an operator):
#   - `EXPLORER_TESTNET_DEPLOY_ROLE` repo secret: IAM role ARN
#     with s3:PutObject on `suwappu-dag-testnet-explorer/*` +
#     cloudfront:CreateInvalidation on the testnet explorer
#     distribution.
#   - terraform/testnet/ already applied so the bucket + distro
#     exist.

on:
  push:
    branches: [main]
    paths:
      - 'clients/explorer/**'
      - 'clients/ts-sdk/**'
      - '.github/workflows/explorer-testnet.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: explorer-testnet-deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build-deploy:
    name: build + deploy (testnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build @suwappu/client TS SDK
        working-directory: clients/ts-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install + typecheck + build explorer
        working-directory: clients/explorer
        env:
          # Bake the testnet RPC URL into the bundle.
          VITE_RPC_URL: https://rpc.testnet.suwappu.globalsettlement.com
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Configure AWS credentials
        if: ${{ env.EXPLORER_TESTNET_DEPLOY_ROLE != '' }}
        env:
          EXPLORER_TESTNET_DEPLOY_ROLE: ${{ secrets.EXPLORER_TESTNET_DEPLOY_ROLE }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.EXPLORER_TESTNET_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        if: ${{ env.EXPLORER_TESTNET_DEPLOY_ROLE != '' }}
        env:
          EXPLORER_TESTNET_DEPLOY_ROLE: ${{ secrets.EXPLORER_TESTNET_DEPLOY_ROLE }}
        working-directory: clients/explorer
        run: |
          aws s3 sync ./dist/ s3://suwappu-dag-testnet-explorer/ \
              --delete \
              --cache-control "public, max-age=300, must-revalidate"
          aws s3 cp ./dist/index.html s3://suwappu-dag-testnet-explorer/index.html \
              --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        if: ${{ env.EXPLORER_TESTNET_DEPLOY_ROLE != '' }}
        env:
          EXPLORER_TESTNET_DEPLOY_ROLE: ${{ secrets.EXPLORER_TESTNET_DEPLOY_ROLE }}
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items[?contains(@, 'explorer.testnet.suwappu')]].Id | [0]" \
              --output text)
          aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"

      - name: Deploy step skipped
        if: ${{ env.EXPLORER_TESTNET_DEPLOY_ROLE == '' }}
        env:
          EXPLORER_TESTNET_DEPLOY_ROLE: ${{ secrets.EXPLORER_TESTNET_DEPLOY_ROLE }}
        run: |
          echo "EXPLORER_TESTNET_DEPLOY_ROLE secret not set; only built locally."
          echo "Set the secret to a role ARN with s3:PutObject + cloudfront:CreateInvalidation."
