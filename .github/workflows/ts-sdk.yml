name: ts-sdk

on:
  push:
    branches: [main]
    paths:
      - 'clients/ts-sdk/**'
      - '.github/workflows/ts-sdk.yml'
  pull_request:
    paths:
      - 'clients/ts-sdk/**'
      - '.github/workflows/ts-sdk.yml'

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/ts-sdk/package-lock.json
      - name: Install (no lockfile yet — fall back to plain install)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Pack (dry-run — publish is gated on a tag push)
        run: npm pack --dry-run

  publish:
    name: npm publish (tag-gated)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Only run on a tag push of the form `ts-sdk-vX.Y.Z`.
    if: startsWith(github.ref, 'refs/tags/ts-sdk-v')
    defaults:
      run:
        working-directory: clients/ts-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
