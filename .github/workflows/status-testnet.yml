name: status-page-testnet

# Deploy the suwappu-testnet status page. Fork of status.yml (devnet)
# with two key differences:
#   * Targets `suwappu-dag-testnet-status` bucket + the testnet
#     CloudFront distribution.
#   * sed-rewrites the `*.devnet.suwappu` URLs in app.js to
#     `*.testnet.suwappu` at upload time so a single status-page
#     source tree can power both environments without code
#     duplication.
#
# Pre-reqs (one-time, set by an operator):
#   - `STATUS_TESTNET_DEPLOY_ROLE` repo secret: IAM role ARN with
#     s3:PutObject + cloudfront:CreateInvalidation on the testnet
#     status bucket + distribution.

on:
  push:
    branches: [main]
    paths:
      - 'clients/status-page/**'
      - '.github/workflows/status-testnet.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: status-page-testnet-deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: rewrite + sync + invalidate (testnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rewrite devnet URLs to testnet
        run: |
          mkdir -p ./build/status
          cp ./clients/status-page/index.html ./build/status/
          # sed-rewrite: every `*.devnet.suwappu.bot`
          # becomes `*.testnet.suwappu.bot`. The
          # status page logic itself is environment-agnostic; only
          # the polling URLs differ.
          sed 's/devnet\.suwappu\.bot/testnet.suwappu.bot/g' \
              ./clients/status-page/app.js > ./build/status/app.js
          # Also flip the page title + the hardcoded devnet explorer link.
          sed -i.bak 's/suwappu-devnet/suwappu-testnet/g; s/devnet\.suwappu\.bot/testnet.suwappu.bot/g' \
              ./build/status/index.html
          rm -f ./build/status/index.html.bak

          # Sanity: confirm no devnet refs remain in the testnet build.
          if grep -q "devnet.suwappu" ./build/status/app.js ./build/status/index.html; then
            echo "ERROR: devnet.suwappu references survived the rewrite; aborting deploy" >&2
            grep -n "devnet.suwappu" ./build/status/app.js ./build/status/index.html
            exit 1
          fi

      - name: Configure AWS credentials
        if: ${{ env.STATUS_TESTNET_DEPLOY_ROLE != '' }}
        env:
          STATUS_TESTNET_DEPLOY_ROLE: ${{ secrets.STATUS_TESTNET_DEPLOY_ROLE }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STATUS_TESTNET_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        if: ${{ env.STATUS_TESTNET_DEPLOY_ROLE != '' }}
        env:
          STATUS_TESTNET_DEPLOY_ROLE: ${{ secrets.STATUS_TESTNET_DEPLOY_ROLE }}
        run: |
          aws s3 sync ./build/status/ s3://suwappu-dag-testnet-status/ \
              --delete \
              --cache-control "public, max-age=60, must-revalidate"
          aws s3 cp ./build/status/index.html s3://suwappu-dag-testnet-status/index.html \
              --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp ./build/status/app.js s3://suwappu-dag-testnet-status/app.js \
              --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        if: ${{ env.STATUS_TESTNET_DEPLOY_ROLE != '' }}
        env:
          STATUS_TESTNET_DEPLOY_ROLE: ${{ secrets.STATUS_TESTNET_DEPLOY_ROLE }}
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items[?contains(@, 'status.testnet.suwappu')]].Id | [0]" \
              --output text)
          aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"

      - name: Deploy step skipped
        if: ${{ env.STATUS_TESTNET_DEPLOY_ROLE == '' }}
        env:
          STATUS_TESTNET_DEPLOY_ROLE: ${{ secrets.STATUS_TESTNET_DEPLOY_ROLE }}
        run: |
          echo "STATUS_TESTNET_DEPLOY_ROLE secret not set; build verified but nothing to deploy."
