name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger from the Actions tab or `gh workflow run ci.yml --ref <branch>`.
  # Useful when GitHub's auto-dispatch on a `pull_request: synchronize` event
  # silently no-ops (we hit this during the 2026-05-24 → 2026-05-25 Actions
  # billing recovery window — PR #222 stopped receiving CI on push).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Use system git for cargo fetches so the SSH deploy key works.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup gsx-db deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GSX_DB_DEPLOY_KEY }}
      - name: Rewrite https://github.com → git@github.com for cargo
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup gsx-db deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GSX_DB_DEPLOY_KEY }}
      - name: Rewrite https://github.com → git@github.com for cargo
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup gsx-db deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GSX_DB_DEPLOY_KEY }}
      - name: Rewrite https://github.com → git@github.com for cargo
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-deny runs on the host runner (not the EmbarkStudios container
      # action) so the SSH agent set up above is reachable for the gsx-db
      # private git dep. The container action exports SSH_AUTH_SOCK into the
      # container but doesn't mount the agent's UNIX socket, breaking auth.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo-deny check
        run: cargo deny check
