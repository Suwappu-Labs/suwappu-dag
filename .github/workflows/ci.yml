name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger from the Actions tab or `gh workflow run ci.yml --ref <branch>`.
  # Useful when GitHub's auto-dispatch on a `pull_request: synchronize` event
  # silently no-ops (we hit this during the 2026-05-24 → 2026-05-25 Actions
  # billing recovery window — PR #222 stopped receiving CI on push).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Use system git for cargo fetches so the SSH deploy key works.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Dependabot-triggered runs read from the *Dependabot* secret store,
      # not Actions secrets, so `secrets.SUWAPPU_DB_DEPLOY_KEY` resolves
      # empty and this job dies inside ssh-agent with the unhelpful
      # "The ssh-private-key argument is empty". Every Dependabot PR on
      # this repo failed that way (PRs #46-#55, 2026-08-15) and looked
      # like ten broken dependency bumps rather than one missing secret.
      # Fail fast with the actual fix instead.
      - name: Preflight — suwappu-db deploy key present
        env:
          KEY: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::SUWAPPU_DB_DEPLOY_KEY is empty for this run (actor: ${{ github.actor }})."
            echo "::error::Dependabot runs do NOT see Actions secrets. Add the same key under" \
                 "Settings -> Secrets and variables -> Dependabot, or this job can never pass on a Dependabot PR."
            exit 1
          fi
          echo "deploy key present"
      - name: Setup suwappu-db deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
      - name: Rewrite https://github.com → git@github.com for cargo
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Warnings are denied via the workflow-level RUSTFLAGS="-D warnings",
      # the same bar `scripts/check.sh` applies locally with an explicit
      # `-- -D warnings`. There is no [workspace.lints] table (yet); this
      # env var is the single enforcement point.
      - run: cargo clippy --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Dependabot-triggered runs read from the *Dependabot* secret store,
      # not Actions secrets, so `secrets.SUWAPPU_DB_DEPLOY_KEY` resolves
      # empty and this job dies inside ssh-agent with the unhelpful
      # "The ssh-private-key argument is empty". Every Dependabot PR on
      # this repo failed that way (PRs #46-#55, 2026-08-15) and looked
      # like ten broken dependency bumps rather than one missing secret.
      # Fail fast with the actual fix instead.
      - name: Preflight — suwappu-db deploy key present
        env:
          KEY: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::SUWAPPU_DB_DEPLOY_KEY is empty for this run (actor: ${{ github.actor }})."
            echo "::error::Dependabot runs do NOT see Actions secrets. Add the same key under" \
                 "Settings -> Secrets and variables -> Dependabot, or this job can never pass on a Dependabot PR."
            exit 1
          fi
          echo "deploy key present"
      - name: Setup suwappu-db deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
      - name: Rewrite https://github.com → git@github.com for cargo
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Dependabot-triggered runs read from the *Dependabot* secret store,
      # not Actions secrets, so `secrets.SUWAPPU_DB_DEPLOY_KEY` resolves
      # empty and this job dies inside ssh-agent with the unhelpful
      # "The ssh-private-key argument is empty". Every Dependabot PR on
      # this repo failed that way (PRs #46-#55, 2026-08-15) and looked
      # like ten broken dependency bumps rather than one missing secret.
      # Fail fast with the actual fix instead.
      - name: Preflight — suwappu-db deploy key present
        env:
          KEY: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::SUWAPPU_DB_DEPLOY_KEY is empty for this run (actor: ${{ github.actor }})."
            echo "::error::Dependabot runs do NOT see Actions secrets. Add the same key under" \
                 "Settings -> Secrets and variables -> Dependabot, or this job can never pass on a Dependabot PR."
            exit 1
          fi
          echo "deploy key present"
      - name: Setup suwappu-db deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
      - name: Rewrite https://github.com → git@github.com for cargo
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-deny runs on the host runner (not the EmbarkStudios container
      # action) so the SSH agent set up above is reachable for the suwappu-db
      # private git dep. The container action exports SSH_AUTH_SOCK into the
      # container but doesn't mount the agent's UNIX socket, breaking auth.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo-deny check
        run: cargo deny check

  crypto-boundary:
    name: crypto lane separation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pure-manifest check (no toolchain, no private-dep access): enforces
      # the lane-separation rule deny.toml points at — primitive crypto
      # crates only inside the audited boundary crates. See
      # scripts/check-crypto-boundary.sh for the allow-list and rationale.
      - run: ./scripts/check-crypto-boundary.sh
