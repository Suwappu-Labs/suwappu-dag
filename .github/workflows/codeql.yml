# CodeQL static analysis (SAST).
#
# Covers the TypeScript client surfaces (ts-sdk, explorer, status-page)
# and the workflow files themselves. Rust is not analyzed here: CodeQL's
# Rust support is not yet GA, and the Rust workspace is gated by clippy
# (-D warnings), cargo-deny, the crypto-boundary check, and weekly
# cargo-fuzz instead. Revisit when CodeQL Rust reaches GA.
#
# All `uses:` refs pinned to full commit SHAs (matches scorecard.yml /
# sbom.yml convention).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, offset from scorecard.yml (Mon 07:00 UTC).
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3.36.2
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3.36.2
        with:
          category: "/language:${{ matrix.language }}"
