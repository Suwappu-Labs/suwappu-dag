# OpenSSF Scorecard — continuous supply-chain posture scanning (epic B3).
#
# Runs the OpenSSF Scorecard checks (branch protection, pinned
# dependencies, token permissions, dangerous workflow patterns, etc.)
# and uploads the result as SARIF to the repo Security tab (Code
# scanning alerts). Results are NOT published to the public OpenSSF
# Scorecard API (`publish_results: false`), so no badge is wired up —
# an empty/unpublished badge renders broken, so we deliberately omit it.
#
# NOTE: GitHub Actions billing is currently disabled for this org, so
# this workflow will not execute until billing is restored. Once Actions
# is on, the weekly cron + push trigger activate automatically and the
# Security tab begins populating; a badge can be added later if/when we
# opt into `publish_results: true`.
#
# All `uses:` refs are pinned to a full 40-char commit SHA; the trailing
# comment records the human-readable version.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Least-privilege: read the repo + write SARIF to the Security tab.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload SARIF to the Security tab
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Keep results private to the Security tab; do not publish to
          # the public OpenSSF API (no badge — see header note).
          publish_results: false

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: results.sarif
