name: docs

# Publish rustdoc + TypeDoc to GitHub Pages on every push to main.
# The Pages site lives at:
#   https://globalsettlementnetwork.github.io/gsx-dag/
#     rust/         — cargo doc output (workspace, no private items)
#     ts/           — TypeDoc for @gsx/client
#
# Pre-req: org-admin enabled GitHub Pages with source = GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'clients/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single in-flight publish at a time; later runs preempt earlier ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build rustdoc + typedoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup gsx-db deploy key
        env:
          GSX_DB_DEPLOY_KEY: ${{ secrets.SUWAPPU_DB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GSX_DB_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Rewrite https://github.com → git@github.com for cargo
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo doc
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          RUSTDOCFLAGS: '-D warnings'
        run: |
          cargo doc --workspace --no-deps
          # Pages root convention: an index page that redirects to the
          # main crate doc. `gsx-node` is the integration crate; pick
          # that as the default.
          mkdir -p target/pages/rust
          cp -r target/doc/* target/pages/rust/
          cat > target/pages/rust/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>gsx-dag rustdoc</title>
          <meta http-equiv="refresh" content="0; url=gsx_node/index.html">
          <p>Redirecting to <a href="gsx_node/index.html">gsx_node</a>...</p>
          EOF

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: TypeDoc
        working-directory: clients/ts-sdk
        run: |
          npm install --no-audit --no-fund
          npx typedoc --out ../../target/pages/ts src/index.ts \
              --readme README.md \
              --name '@gsx/client'

      - name: Landing page
        run: |
          mkdir -p target/pages
          cat > target/pages/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>gsx-dag documentation</title>
          <style>
            body { font: 16px system-ui; max-width: 640px; margin: 4em auto; padding: 0 1em; line-height: 1.6; }
            code { background: #f4f4f4; padding: 0.1em 0.4em; border-radius: 3px; }
            a { color: #06c; }
          </style>
          <h1>gsx-dag — generated documentation</h1>
          <p>Auto-published from <a href="https://github.com/GlobalSettlementNetwork/gsx-dag">main</a> on every merge.</p>
          <ul>
            <li><a href="rust/">Rust API docs</a> — every workspace crate, public surface only.</li>
            <li><a href="ts/">TypeScript SDK docs</a> — @gsx/client.</li>
          </ul>
          <p>See also: the <a href="https://github.com/GlobalSettlementNetwork/gsx-dag#readme">project README</a>, the <a href="https://github.com/GlobalSettlementNetwork/gsx-dag/blob/main/DEVNET.md">devnet quickstart</a>, and the <a href="https://github.com/GlobalSettlementNetwork/gsx-dag/tree/main/docs">full docs tree</a>.</p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    name: deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
