# Supply-chain SBOM publishing (epic B3).
#
# Generates a CycloneDX SBOM for the whole Cargo workspace with Syft
# (which reads Cargo.lock natively) and attaches it to the GitHub
# Release as a downloadable asset. A checked-in SBOM also lives under
# `sbom/` in the repo; this workflow keeps the per-release artifact in
# sync without anyone running a tool by hand.
#
# NOTE: GitHub Actions billing is currently disabled for this org, so
# this workflow will not execute until billing is restored. It is
# committed SHA-pinned and ready to run the moment Actions is on.
#
# All `uses:` refs are pinned to a full 40-char commit SHA; the trailing
# comment records the human-readable version.

name: sbom

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # required to attach the SBOM as a Release asset

jobs:
  sbom:
    name: generate + attach CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate CycloneDX SBOM (Syft reads Cargo.lock)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: suwappu-dag.cdx.json
          artifact-name: suwappu-dag.cdx.json
          # Attach the SBOM to the published Release. No-op on
          # workflow_dispatch runs (no release context), where the SBOM
          # is still uploaded as a workflow artifact instead.
          upload-release-assets: true
