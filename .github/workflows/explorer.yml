name: explorer

# Build + deploy the suwappu-devnet block explorer SPA to S3 + invalidate
# CloudFront on every push to main that touches the explorer or its
# SDK dep. Manual dispatch is also wired for ad-hoc rebuilds.
#
# Pre-reqs (one-time, set by an operator):
#   - AWS IAM role for GitHub OIDC with s3:PutObject on
#     `suwappu-dag-devnet-explorer/*` + cloudfront:CreateInvalidation on
#     the explorer distribution.
#   - The role ARN must be set as the `EXPLORER_DEPLOY_ROLE` repo
#     secret (or org secret).
#   - terraform/devnet/ already applied so the bucket + distro exist.

on:
  push:
    branches: [main]
    paths:
      - 'clients/explorer/**'
      - 'clients/ts-sdk/**'
      - '.github/workflows/explorer.yml'
  workflow_dispatch:

# OIDC against AWS IAM — no long-lived AWS access keys in repo secrets.
permissions:
  contents: read
  id-token: write

concurrency:
  group: explorer-deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build-deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Build the TS SDK first — the explorer depends on its
      # `dist/` output via file:../ts-sdk.
      - name: Build @suwappu/client TS SDK
        working-directory: clients/ts-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install + typecheck + build explorer
        working-directory: clients/explorer
        env:
          # Bake the public devnet URL into the bundle. Override
          # locally by setting VITE_RPC_URL.
          VITE_RPC_URL: https://rpc.devnet.suwappu.globalsettlement.com
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Configure AWS credentials
        if: ${{ env.EXPLORER_DEPLOY_ROLE != '' }}
        env:
          EXPLORER_DEPLOY_ROLE: ${{ secrets.EXPLORER_DEPLOY_ROLE }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.EXPLORER_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        if: ${{ env.EXPLORER_DEPLOY_ROLE != '' }}
        env:
          EXPLORER_DEPLOY_ROLE: ${{ secrets.EXPLORER_DEPLOY_ROLE }}
        working-directory: clients/explorer
        run: |
          aws s3 sync ./dist/ s3://suwappu-dag-devnet-explorer/ \
              --delete \
              --cache-control "public, max-age=300, must-revalidate"
          # index.html is the entry point; bust its cache aggressively
          # so hash routing keeps working after a deploy.
          aws s3 cp ./dist/index.html s3://suwappu-dag-devnet-explorer/index.html \
              --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        if: ${{ env.EXPLORER_DEPLOY_ROLE != '' }}
        env:
          EXPLORER_DEPLOY_ROLE: ${{ secrets.EXPLORER_DEPLOY_ROLE }}
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items[?contains(@, 'explorer.devnet.suwappu')]].Id | [0]" \
              --output text)
          aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"

      - name: Deploy step skipped
        if: ${{ env.EXPLORER_DEPLOY_ROLE == '' }}
        env:
          EXPLORER_DEPLOY_ROLE: ${{ secrets.EXPLORER_DEPLOY_ROLE }}
        run: |
          echo "EXPLORER_DEPLOY_ROLE secret not set; only built locally."
          echo "Set the secret to a role ARN with s3:PutObject + cloudfront:CreateInvalidation."
