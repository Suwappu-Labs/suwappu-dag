# AWS CodeBuild spec for the perf testnet validator binaries.
#
# Image: aws/codebuild/standard:7.0 (Ubuntu 22.04). Ships with rust pre-
# installed under /root/.cargo. Target is x86_64-unknown-linux-gnu (the
# native target of the image); glibc 2.35 is forward-compatible with the
# Ubuntu 24.04 (glibc 2.39+) AMI we deploy to.

version: 0.2

env:
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"

phases:
  install:
    # GNU target instead of musl: pqcrypto-mlkem's C-bundled pqclean code
    # doesn't compile under musl-gcc (pqclean/common/compat.h breakage).
    # Ubuntu 22.04 CodeBuild image has glibc 2.35; Ubuntu 24.04 EC2 targets
    # have glibc 2.39+ which is forward-compatible, so a glibc-linked binary
    # runs unmodified on the validators.
    commands:
      - apt-get update -qq
      - apt-get install -y build-essential pkg-config libssl-dev zip jq
      - rustc --version || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustc --version

  pre_build:
    commands:
      - export PATH="$HOME/.cargo/bin:$PATH"
      # Pull the gsx-db deploy key from SSM SecureString. If missing, bail.
      - |
        if ! aws ssm get-parameter --name /gsx-perf/gsx-db-deploy-key --with-decryption --query Parameter.Value --output text > /tmp/gsx-db.key 2>/tmp/ssm-err; then
          echo "ERROR: SSM /gsx-perf/gsx-db-deploy-key not found." >&2
          cat /tmp/ssm-err >&2
          exit 1
        fi
      - chmod 600 /tmp/gsx-db.key
      - mkdir -p ~/.ssh
      - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      - eval "$(ssh-agent -s)"
      - ssh-add /tmp/gsx-db.key
      - git config --global url."git@github.com:".insteadOf "https://github.com/"

  build:
    commands:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - cd $CODEBUILD_SRC_DIR
      - cargo build --release --target x86_64-unknown-linux-gnu --bin gsx-node --bin gsx-loadgen --bin gsx-metrics

  post_build:
    commands:
      - mkdir -p $CODEBUILD_SRC_DIR/out
      - cp target/x86_64-unknown-linux-gnu/release/gsx-node $CODEBUILD_SRC_DIR/out/
      - cp target/x86_64-unknown-linux-gnu/release/gsx-loadgen $CODEBUILD_SRC_DIR/out/
      - cp target/x86_64-unknown-linux-gnu/release/gsx-metrics $CODEBUILD_SRC_DIR/out/
      - strip $CODEBUILD_SRC_DIR/out/* || true
      - ls -lh $CODEBUILD_SRC_DIR/out/
      - file $CODEBUILD_SRC_DIR/out/gsx-node

artifacts:
  files:
    - out/gsx-node
    - out/gsx-loadgen
    - out/gsx-metrics
  discard-paths: yes

cache:
  paths:
    - "/root/.cargo/registry/**/*"
    - "/root/.cargo/git/**/*"
