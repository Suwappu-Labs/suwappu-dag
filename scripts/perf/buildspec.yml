# AWS CodeBuild spec for the musl cross-compile.
#
# Invoked by scripts/perf/build.sh after uploading the source zip to
# s3://<artifact_bucket>/sources/gsx-dag.zip. CodeBuild extracts the zip into
# $CODEBUILD_SRC_DIR, then runs this spec.
#
# Output: three statically-linked binaries at
#   - $CODEBUILD_SRC_DIR/out/gsx-node
#   - $CODEBUILD_SRC_DIR/out/gsx-loadgen
#   - $CODEBUILD_SRC_DIR/out/gsx-metrics
# These are uploaded by the artifacts: stanza to s3://<bucket>/bin/.

version: 0.2

env:
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    # Cargo cache lives on the CodeBuild S3 cache mount.
    CARGO_HOME: "/root/.cargo"
    RUSTUP_HOME: "/root/.rustup"

phases:
  install:
    runtime-versions:
      # rust runtime is available via aws/codebuild/amazonlinux2-x86_64-standard:5.0
      # but using its rust may be stale; we install the latest stable + add musl.
    commands:
      - yum install -y musl-gcc musl-libc-static gcc-c++ openssl-devel pkgconfig zip jq
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - source $CARGO_HOME/env
      - rustup target add x86_64-unknown-linux-musl
      - rustc --version
      - cargo --version

  pre_build:
    commands:
      # gsx-db is a private git dep. The deploy key is delivered via SSM
      # Parameter Store at /gsx-perf/gsx-db-deploy-key (SecureString). If
      # missing, the build aborts here with a clear message.
      - |
        if ! aws ssm get-parameter --name /gsx-perf/gsx-db-deploy-key --with-decryption --query Parameter.Value --output text > /tmp/gsx-db.key 2>/tmp/ssm-err; then
          echo "ERROR: SSM parameter /gsx-perf/gsx-db-deploy-key not found." >&2
          cat /tmp/ssm-err >&2
          echo "" >&2
          echo "Upload it with:" >&2
          echo "  aws ssm put-parameter --name /gsx-perf/gsx-db-deploy-key --type SecureString --value \"\$(cat ~/.ssh/gsx-db-deploy)\" --profile gsn" >&2
          exit 1
        fi
      - chmod 600 /tmp/gsx-db.key
      - mkdir -p ~/.ssh
      - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      - eval "$(ssh-agent -s)"
      - ssh-add /tmp/gsx-db.key
      - git config --global url."git@github.com:".insteadOf "https://github.com/"

  build:
    commands:
      - cd $CODEBUILD_SRC_DIR
      - cargo build --release --target x86_64-unknown-linux-musl --bin gsx-node --bin gsx-loadgen --bin gsx-metrics

  post_build:
    commands:
      - mkdir -p $CODEBUILD_SRC_DIR/out
      - cp target/x86_64-unknown-linux-musl/release/gsx-node $CODEBUILD_SRC_DIR/out/
      - cp target/x86_64-unknown-linux-musl/release/gsx-loadgen $CODEBUILD_SRC_DIR/out/
      - cp target/x86_64-unknown-linux-musl/release/gsx-metrics $CODEBUILD_SRC_DIR/out/
      - strip $CODEBUILD_SRC_DIR/out/*
      - ls -lh $CODEBUILD_SRC_DIR/out/
      - file $CODEBUILD_SRC_DIR/out/gsx-node

artifacts:
  files:
    - out/gsx-node
    - out/gsx-loadgen
    - out/gsx-metrics
  discard-paths: yes

cache:
  paths:
    - "/root/.cargo/registry/**/*"
    - "/root/.cargo/git/**/*"
    - "target/**/*"
