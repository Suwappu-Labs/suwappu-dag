# AWS CodeBuild spec for the musl cross-compile.
#
# Image: aws/codebuild/standard:7.0 (Ubuntu 22.04). Ships with rust + cargo
# pre-installed under /root/.cargo. We just `rustup target add` for musl
# and install musl-tools via apt.

version: 0.2

env:
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"

phases:
  install:
    commands:
      - apt-get update -qq
      - apt-get install -y musl-tools build-essential pkg-config libssl-dev zip jq
      # standard:7.0 has rust pre-installed; just confirm + add target.
      - rustc --version || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add x86_64-unknown-linux-musl
      - rustc --version

  pre_build:
    commands:
      - export PATH="$HOME/.cargo/bin:$PATH"
      # Pull the gsx-db deploy key from SSM SecureString. If missing, bail.
      - |
        if ! aws ssm get-parameter --name /gsx-perf/gsx-db-deploy-key --with-decryption --query Parameter.Value --output text > /tmp/gsx-db.key 2>/tmp/ssm-err; then
          echo "ERROR: SSM /gsx-perf/gsx-db-deploy-key not found." >&2
          cat /tmp/ssm-err >&2
          exit 1
        fi
      - chmod 600 /tmp/gsx-db.key
      - mkdir -p ~/.ssh
      - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      - eval "$(ssh-agent -s)"
      - ssh-add /tmp/gsx-db.key
      - git config --global url."git@github.com:".insteadOf "https://github.com/"

  build:
    commands:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - cd $CODEBUILD_SRC_DIR
      - cargo build --release --target x86_64-unknown-linux-musl --bin gsx-node --bin gsx-loadgen --bin gsx-metrics

  post_build:
    commands:
      - mkdir -p $CODEBUILD_SRC_DIR/out
      - cp target/x86_64-unknown-linux-musl/release/gsx-node $CODEBUILD_SRC_DIR/out/
      - cp target/x86_64-unknown-linux-musl/release/gsx-loadgen $CODEBUILD_SRC_DIR/out/
      - cp target/x86_64-unknown-linux-musl/release/gsx-metrics $CODEBUILD_SRC_DIR/out/
      - strip $CODEBUILD_SRC_DIR/out/* || true
      - ls -lh $CODEBUILD_SRC_DIR/out/
      - file $CODEBUILD_SRC_DIR/out/gsx-node

artifacts:
  files:
    - out/gsx-node
    - out/gsx-loadgen
    - out/gsx-metrics
  discard-paths: yes

cache:
  paths:
    - "/root/.cargo/registry/**/*"
    - "/root/.cargo/git/**/*"
