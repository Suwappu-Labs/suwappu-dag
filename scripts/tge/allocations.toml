# SUWP mainnet genesis allocation ledger (the pre-mine, published).
#
# This file is the auditable source of truth for the fair-launch
# pre-mine: 100% of the fixed 1,000,000,000 SUWP supply is minted in
# the genesis block into the pools below. There is no other issuance
# path — the emitted fragment carries `max_supply_suwappu` equal to
# this ledger's sum, the manifest loader refuses prebalances above
# it, and the sealed on-chain supply ledger makes every
# `Intent::MintInflation` fail with `MaxSupplyExceeded`
# (crates/suwappu-execution/src/substrate.rs).
#
# Fair-launch constraint (docs/whitepaper/TOKENOMICS.md): no team,
# investor, private-sale, or foundation-treasury allocation. Every
# pool below is distributed through an open, published program.
#
# Pool addresses are NOT free-form: each is derived as the leading
# 20 bytes of BLAKE3(domain_tag), the chain's reserved-address scheme
# (crates/suwappu-execution/src/reserved.rs). Run
#
#     python3 scripts/tge/gen-tge-prebalances.py --check
#
# to verify (a) each address matches its domain tag, (b) the amounts
# sum to exactly total_supply_suwappu, and to emit the genesis.toml
# [[prebalances]] fragment.

total_supply_suwappu = 1_000_000_000

[[pools]]
name = "tge-fair-launch"
domain_tag = "suwappu-tge-fair-launch-pool-v1"
address = "0xf9e86688d4afeeff73b01067237e5529149905f0"
amount_suwappu = 420_000_000
distribution = "Open public distribution at TGE — pro-rata, no allowlist, no private tranche."

[[pools]]
name = "tge-seasons-program"
domain_tag = "suwappu-tge-seasons-pool-v1"
address = "0xae360caae624555b7fc6a2b7a96def76780d9e43"
amount_suwappu = 300_000_000
distribution = "8-season decaying usage-reward schedule per suwappubot/docs/economics/SEASONS_TOKENOMICS.md (A = 30%, delta = 0.75)."

[[pools]]
name = "tge-staking-rewards-authority"
domain_tag = "suwappu-authority-rewards-pool-v1"
address = "0x1148457e50ba9ee1b9197e98dd0efc096063a50c"
amount_suwappu = 100_000_000
distribution = "Authority Ring staking rewards. Pre-mined directly into the EXISTING authority rewards pool, drained per epoch by Intent::DistributeRewards (replay-defended, reserved-recipient-rejecting) — no new distribution code needed. Replaces open-ended MintInflation, which the sealed supply ledger fail-closes. Pool exhaustion = fee-funded rewards only."

[[pools]]
name = "tge-staking-rewards-validator"
domain_tag = "suwappu-validator-rewards-pool-v1"
address = "0xef9bd42745ebdf4dbcb15e21426a670efbc407f5"
amount_suwappu = 100_000_000
distribution = "Validator Ring staking rewards — mirror of the authority entry via the existing validator rewards pool + Intent::DistributeRewards."

[[pools]]
name = "tge-testnet-points"
domain_tag = "suwappu-tge-testnet-points-pool-v1"
address = "0x9e28b89b1c3b49a75f3b782e0ac9ee5919b340f9"
amount_suwappu = 80_000_000
distribution = "Testnet validator points conversion per docs/testnet/POINTS.md. 8% ceiling reserved; board pins final % in [5, 8] >= 90 days pre-TGE; the un-pinned remainder and unclaimed balances are burned 180 days after TGE."
