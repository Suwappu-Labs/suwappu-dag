[package]
name = "suwappu-mempool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Priority + rate-limited mempool for suwappu-dag. Replaces the FIFO pending_intents channel between client ingress and the round-driver."

[lib]
name = "suwappu_mempool"
path = "src/lib.rs"

[dependencies]
# The intents we queue.
suwappu-execution = { workspace = true }

# Canonical intent hash uses blake3 over the bincode bytes — same
# value rpc_adapter::submit_intent returns and the round-driver
# indexes into tx_to_block.
blake3 = { workspace = true }
bincode = { workspace = true }

serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
