[package]
name = "gsx-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "JSON-RPC query API for the gsx-dag node. Phase 2.1 read-only MVP."

[dependencies]
gsx-consensus = { workspace = true }
gsx-authority = { workspace = true }
gsx-validator = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

tokio = { workspace = true }
# `ws` feature enables `axum::extract::ws::WebSocketUpgrade` for the
# `gsx_subscribeEvents` live stream (T6). The HTTP POST surface
# doesn't need it, but adding to the dep is cheap (axum is already in
# tree).
axum = { version = "0.7", features = ["ws"] }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
blake3 = { workspace = true }
