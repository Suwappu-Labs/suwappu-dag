[package]
name = "gsx-l2-stm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "GSX DAG L2 state transition function — native reference implementation (Track G G1 / Phase 1.1, issue #82). The SP1 guest program lands alongside this crate under `program/` in a follow-up; this crate's lib is what the host code (sequencer, prover, force-include daemon) imports."

[dependencies]
# Layout constants + offset spec for the 240-byte public-input
# blob. Must agree byte-for-byte with sp1_verifier::Groth16Verifier's
# expected public-input format — this crate's `to_public_inputs`
# round-trips through the same offsets.
gsx-l2-verifier-precompile.workspace = true
# `BurnLeaf::hash` + `hash_inner_node` per IQ-008. The STM is the
# producer of L2 burn proofs; reusing the same leaf + inner-node
# hash primitives the substrate (`Intent::L2BurnProven`) verifies
# against keeps a single source of truth for the burn-tree
# scheme. Adds no host-side cost; the SP1 guest is also fine with
# bridge's `serde`/`thiserror`/`blake3` set (matches STM's existing
# deps).
gsx-l2-bridge.workspace = true

blake3.workspace = true
serde.workspace = true
thiserror.workspace = true
hex.workspace = true

[dev-dependencies]
proptest.workspace = true
