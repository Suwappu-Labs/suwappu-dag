[package]
name = "suwappu-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "SUWAPPU DAG L1 cryptographic primitives: ML-DSA-65, ML-KEM-768, BLS12-381, SHA3-256, Poseidon2 (paper §3.3, §10, §12)."

[dependencies]
# Post-quantum (FIPS 204 / FIPS 203)
pqcrypto-mldsa.workspace = true
pqcrypto-mlkem.workspace = true
pqcrypto-traits.workspace = true

# Classical (migration window, paper Table 1)
blst.workspace = true

# Hashing
sha3.workspace = true
hkdf.workspace = true

# Utilities
serde.workspace = true
thiserror.workspace = true
hex.workspace = true
rand = { workspace = true }
rand_chacha = { workspace = true }

# suwappu-keygen CLI binary only
clap.workspace = true

[[bin]]
name = "suwappu-keygen"
path = "src/bin/suwappu-keygen.rs"

[dev-dependencies]
proptest.workspace = true
hex.workspace = true
