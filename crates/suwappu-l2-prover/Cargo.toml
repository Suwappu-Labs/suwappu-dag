[package]
name = "suwappu-l2-prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "SUWAPPU L2 prover daemon binary (Track G G4.1, #104). Long-running daemon that pulls unproven batches from an UnprovenBatchSource, proves them via a Prover trait, and submits the resulting proof — with Tokio retry/backoff, structured tracing, and a hand-rolled Prometheus metrics endpoint. SCAFFOLD: the real SP1 proving body is gated behind the Prover trait; the shipped StubProver returns a clear error. Real proving lands once #88 (revm-in-guest) and the #94 sp1-sdk decision are resolved."

[lib]
name = "suwappu_l2_prover"
path = "src/lib.rs"

[[bin]]
name = "suwappu-l2-prover"
path = "src/main.rs"

[dependencies]
# Runtime + CLI + config + logging. Same shape as the sibling
# suwappu-l2-sequencer-daemon's daemon stack — kept deliberately lean
# so the binary stays auditable for a long-running process.
tokio.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Async trait surface for UnprovenBatchSource + Prover + their mocks.
async-trait = "0.1"

# Hand-rolled /metrics HTTP server (mirrors suwappu-node's metrics_http.rs:
# the Prometheus text format is trivial, so we avoid the ~20-dep
# `prometheus` crate tree). axum + its workspace siblings are already
# in the dep tree via suwappu-node, so this adds no new transitive surface.
axum = "0.7"

[dev-dependencies]
# Round-trip tests for ProverConfig (de)serialization.
serde_json.workspace = true
# `test-util` unlocks the paused-clock test harness
# (`#[tokio::test(start_paused = true)]`) so the retry/backoff tests
# auto-advance time instead of waiting wall-clock. Features are
# additive; the workspace pin is reused so versions don't drift, and
# dev-deps never compile into the shipped binary.
tokio = { workspace = true, features = ["test-util"] }
