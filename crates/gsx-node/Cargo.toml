[package]
name = "gsx-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Top-level GSX DAG node binary: composes all layers into a running validator."

[lib]
name = "gsx_node"
path = "src/lib.rs"

[[bin]]
name = "gsx-node"
path = "src/main.rs"

[dependencies]
gsx-crypto.workspace = true
gsx-consensus.workspace = true
gsx-authority.workspace = true
gsx-validator.workspace = true
gsx-fastpath.workspace = true
gsx-execution.workspace = true
gsx-precompiles.workspace = true
gsx-ltp.workspace = true
gsx-transport.workspace = true

anyhow.workspace = true
bincode.workspace = true
blake3.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
proptest.workspace = true
