[package]
name = "gsx-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Top-level GSX DAG node binary: composes all layers into a running validator."

[lib]
name = "gsx_node"
path = "src/lib.rs"

[[bin]]
name = "gsx-node"
path = "src/main.rs"

[[bin]]
name = "gsx-loadgen"
path = "src/bin/gsx-loadgen.rs"

[[bin]]
name = "gsx-metrics"
path = "src/bin/gsx-metrics.rs"

[[bin]]
name = "gsx-keygen"
path = "src/bin/gsx-keygen.rs"

[dependencies]
gsx-crypto.workspace = true
gsx-consensus.workspace = true
gsx-authority.workspace = true
gsx-validator.workspace = true
gsx-fastpath.workspace = true
gsx-execution.workspace = true
gsx-precompiles.workspace = true
gsx-ltp.workspace = true
gsx-transport.workspace = true
gsx-rpc.workspace = true
gsx-mempool.workspace = true

anyhow.workspace = true
# G6: minimal Prometheus metrics endpoint (hand-rolled exporter,
# `metrics_http.rs`). gsx-rpc already pulls axum; consuming it here
# adds nothing to the binary tree.
axum = { version = "0.7", features = ["macros"] }
bincode.workspace = true
blake3.workspace = true
clap.workspace = true
hex.workspace = true
# Pull the vendored-openssl flag into the linker graph so the musl build
# bundles OpenSSL from source (reqwest -> openssl-sys transitive dep).
openssl-sys.workspace = true
# DAG-S31.3: parking_lot::Mutex for short critical sections on
# votes/blocks/committed where the previous tokio::sync::Mutex's
# async-yield overhead was wasted on sub-microsecond HashMap/HashSet
# operations.
parking_lot = "0.12"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
proptest.workspace = true
