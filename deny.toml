# cargo-deny config for gsx-dag
# Enforces dependency hygiene at the workspace level.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` is unmaintained but stable and widely used by tracing-derive,
    # serde-derive, and pqcrypto. No known vulnerabilities; replacement is
    # tracked upstream in RUSTSEC-2024-0436. Revisit when those crates migrate.
    "RUSTSEC-2024-0436",
    # `rustls-pemfile` is unmaintained; pulled in transitively by `reqwest 0.11`
    # via `gsxdb-bridge`. No known vulnerabilities. Cleared when gsxdb-bridge
    # bumps to reqwest 0.12 (rustls-pki-types path). Tracked at
    # RUSTSEC-2025-0134 / https://github.com/rustls/pemfile/issues/61.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # Unicode-3.0 replaces Unicode-DFS-2016 in crates published post-2024
    # (icu / unicode-ident family). The license terms are equivalent.
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # webpki-roots ships the Mozilla CA root list under CDLA-Permissive-2.0,
    # which is the OSI/SPDX-listed Community Data License. Pulled in via
    # reqwest/ureq -> gsxdb-bridge.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "..."` dependencies look like wildcards to
# cargo-deny without this flag — the workspace itself is the version source.
allow-wildcard-paths = true
highlight = "all"

# Lane separation analog: forbid pulling unaudited crypto into non-crypto crates.
# Enforced separately by scripts/check-crypto-boundary.sh in CI.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # gsx-db state substrate (paper §7.4). Consumed at v0.1.0 by
    # gsx-execution's GsxDbSubstrate adapter.
    "https://github.com/GlobalSettlementNetwork/gsx-db",
]
