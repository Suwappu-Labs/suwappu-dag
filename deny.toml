# cargo-deny config for suwappu-dag
# Enforces dependency hygiene at the workspace level.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# B5 audit sweep (2026-05-15): re-evaluated each accepted ignore.
# All three remain BLOCKED on upstream changes outside this repo;
# every entry below now carries a `Re-check:` date and a `Gate:`
# condition so we don't silently carry these forever. When the gate
# clears, the ignore is removed in the same PR that bumps the dep.
ignore = [
    # `paste` is unmaintained but stable and widely used by tracing-derive,
    # serde-derive, and pqcrypto. No known vulnerabilities.
    # Gate: tracing-derive + pqcrypto migrate off `paste`.
    # Re-check: 2026-Q3.
    "RUSTSEC-2024-0436",
    # `rustls-pemfile` is unmaintained; pulled in transitively by
    # `reqwest 0.11` via `suwappudb-bridge`. No known vulnerabilities.
    # Gate: suwappu-db's suwappudb-bridge bumps to reqwest 0.12 (which uses
    # rustls-pki-types instead). Tracked at
    # https://github.com/rustls/pemfile/issues/61.
    # Re-check: when suwappu-db releases v0.2.0.
    "RUSTSEC-2025-0134",
    # `bincode` (the entire crate, all versions) is unmaintained. The
    # advisory was filed against bincode 1.x and ALSO covers 2.x — F4
    # (2026-05-16) migrated workspace-wide to 2.0.1 thinking the
    # ignore could drop, but the advisory is project-scope, not
    # version-scope ("the bincode team has taken the decision to cease
    # development permanently"). No safe upgrade exists.
    # Gate: workspace migration to one of the suggested alternatives
    # (postcard, rkyv, bitcode). Each requires a wire-format hard fork
    # plus a new IQ comparing throughput vs decode safety vs ergonomics.
    # The F4 wire-frame version byte (`FRAME_VERSION_V1 = 0x01`) was
    # added precisely to make this future migration detectable.
    # Re-check: 2026-Q4.
    "RUSTSEC-2025-0141",
    # pqcrypto-{mlkem,traits,internals,mldsa} unmaintained: upstream PQClean
    # archived (2026). No vulnerability — these are the ML-KEM-768 / ML-DSA-65
    # (FIPS 203/204) bindings central to the chain's PQ consensus + LTP. The
    # pure-Rust `ml-dsa`/`ml-kem` (RustCrypto) crates are the migration target;
    # until they're production-ready, the PQClean-backed impls are the reference.
    "RUSTSEC-2026-0161",
    "RUSTSEC-2026-0162",
    "RUSTSEC-2026-0163",
    "RUSTSEC-2026-0166",
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # Unicode-3.0 replaces Unicode-DFS-2016 in crates published post-2024
    # (icu / unicode-ident family). The license terms are equivalent.
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # webpki-roots ships the Mozilla CA root list under CDLA-Permissive-2.0,
    # which is the OSI/SPDX-listed Community Data License. Pulled in via
    # reqwest/ureq -> suwappudb-bridge.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "..."` dependencies look like wildcards to
# cargo-deny without this flag — the workspace itself is the version source.
allow-wildcard-paths = true
highlight = "all"

# Lane separation analog: forbid pulling unaudited crypto into non-crypto crates.
# Enforced separately by scripts/check-crypto-boundary.sh in CI.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # suwappu-db state substrate (paper §7.4). Consumed at v0.1.0 by
    # suwappu-execution's SuwappuDbSubstrate adapter.
    "https://github.com/Suwappu-Labs/suwappu-db",
]
