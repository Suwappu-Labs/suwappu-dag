[package]
name = "gsx-examples-rust"
version = "0.1.0"
publish = false
edition = "2021"
description = "Standalone runnable examples against a local gsx-dag devnet."

# Excluded from the main workspace so its `reqwest`/`tokio-tungstenite`
# feature flags don't push the whole workspace's dep tree around.

[dependencies]
gsx-client = { path = "../../clients/rust-sdk" }
gsx-execution = { path = "../../crates/gsx-execution" }
gsx-crypto = { path = "../../crates/gsx-crypto" }
gsx-rpc = { path = "../../crates/gsx-rpc" }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
bincode = "1"
blake3 = "1"
hex = "0.4"
anyhow = "1"
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"] }
futures-util = "0.3"

[[bin]]
name = "query_epoch"
path = "query_epoch.rs"

[[bin]]
name = "query_balance"
path = "query_balance.rs"

[[bin]]
name = "subscribe_events"
path = "subscribe_events.rs"

[[bin]]
name = "submit_transfer"
path = "submit_transfer.rs"

[[bin]]
name = "admit_authority"
path = "admit_authority.rs"

[dependencies.clap]
version = "4"
features = ["derive"]
