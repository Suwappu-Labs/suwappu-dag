# Local 4-node gsx-dag devnet.
#
# Driven by `scripts/devnet-local.sh up`, which first runs
# `scripts/gen-devnet-genesis.py` to populate ./target/devnet/ with
# the genesis manifest + per-validator keys + a per-validator
# node.toml whose `peers = ...` references the predictable
# 172.30.0.0/24 IPs declared below.
#
# Bring up: ./scripts/devnet-local.sh up
# Tear down: ./scripts/devnet-local.sh down
#
# Once up, exercise it from the host:
#   curl -sX POST http://127.0.0.1:9092 -H 'content-type: application/json' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"gsx_getEpoch","params":null}'
# Or run an example:
#   cargo run -p gsx-client --example submit_transfer
# (Track C2 ships the examples.)

services:
  v0:
    build: .
    image: gsx-dag:devnet
    container_name: gsx-devnet-v0
    networks:
      gsxnet:
        ipv4_address: 172.30.0.10
    ports:
      # Host-exposed JSON-RPC + client-listen on v0 only (so an
      # external SDK can submit to the cluster via one entry point).
      - "9092:9092"   # JSON-RPC
      - "9091:9091"   # TCP client-listen
    volumes:
      - ./target/devnet/v0:/etc/gsx:ro
      - ./target/devnet/genesis.toml:/etc/gsx/genesis.toml:ro
      - v0-logs:/var/log/gsx
    command: ["--config", "/etc/gsx/node.toml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST",
             "http://127.0.0.1:9092",
             "-H", "content-type: application/json",
             "-d", '{"jsonrpc":"2.0","id":1,"method":"gsx_getEpoch","params":null}']
      interval: 5s
      timeout: 2s
      retries: 12

  v1:
    image: gsx-dag:devnet
    container_name: gsx-devnet-v1
    networks:
      gsxnet:
        ipv4_address: 172.30.0.11
    volumes:
      - ./target/devnet/v1:/etc/gsx:ro
      - ./target/devnet/genesis.toml:/etc/gsx/genesis.toml:ro
      - v1-logs:/var/log/gsx
    command: ["--config", "/etc/gsx/node.toml"]
    depends_on:
      - v0

  v2:
    image: gsx-dag:devnet
    container_name: gsx-devnet-v2
    networks:
      gsxnet:
        ipv4_address: 172.30.0.12
    volumes:
      - ./target/devnet/v2:/etc/gsx:ro
      - ./target/devnet/genesis.toml:/etc/gsx/genesis.toml:ro
      - v2-logs:/var/log/gsx
    command: ["--config", "/etc/gsx/node.toml"]
    depends_on:
      - v0

  v3:
    image: gsx-dag:devnet
    container_name: gsx-devnet-v3
    networks:
      gsxnet:
        ipv4_address: 172.30.0.13
    volumes:
      - ./target/devnet/v3:/etc/gsx:ro
      - ./target/devnet/genesis.toml:/etc/gsx/genesis.toml:ro
      - v3-logs:/var/log/gsx
    command: ["--config", "/etc/gsx/node.toml"]
    depends_on:
      - v0

  postgres:
    # Backing store for the indexer (A5). Not started by default —
    # bring up with `docker compose --profile indexer up`.
    image: postgres:16-alpine
    container_name: gsx-devnet-postgres
    profiles: [indexer]
    networks:
      gsxnet:
        ipv4_address: 172.30.0.20
    environment:
      POSTGRES_USER: gsx
      POSTGRES_PASSWORD: gsx
      POSTGRES_DB: gsx_indexer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  indexer:
    # gsx-indexer (A5). Tails v0's WebSocket subscription and
    # persists committed blocks to Postgres. Bring up alongside
    # postgres via `docker compose --profile indexer up`.
    image: gsx-dag:devnet
    container_name: gsx-devnet-indexer
    profiles: [indexer]
    networks:
      gsxnet:
        ipv4_address: 172.30.0.21
    entrypoint: ["/usr/local/bin/gsx-indexer"]
    command: [
      "--ws-url", "ws://172.30.0.10:9092/ws",
      "--listen", "0.0.0.0:9093",
      "--database-url", "postgres://gsx:gsx@172.30.0.20:5432/gsx_indexer",
    ]
    ports:
      - "9093:9093"
    depends_on:
      - v0
      - postgres

networks:
  gsxnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  v0-logs:
  v1-logs:
  v2-logs:
  v3-logs:
  pgdata:
