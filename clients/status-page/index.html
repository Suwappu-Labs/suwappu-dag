<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>suwappu-devnet status</title>
  <meta name="description" content="Live status page for the suwappu-devnet public testnet.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='28' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0a0a0a; --fg: #e8e8e8; --fg-muted: #888;
      --green: #4c6; --yellow: #db4; --red: #e44;
      --border: #222; --row-alt: #111;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fff; --fg: #111; --fg-muted: #666;
        --green: #0a7; --yellow: #c80; --red: #c00;
        --border: #ddd; --row-alt: #f7f7f7;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-weight: 500; margin: 0 0 0.3rem; font-size: 1.7rem; }
    .subtitle { color: var(--fg-muted); margin-bottom: 2rem; }
    .overall {
      padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;
      border: 1px solid var(--border); display: flex; align-items: center; gap: 1rem;
    }
    .overall .dot {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      background: var(--fg-muted);
    }
    .overall.green .dot { background: var(--green); box-shadow: 0 0 16px var(--green); }
    .overall.yellow .dot { background: var(--yellow); box-shadow: 0 0 16px var(--yellow); }
    .overall.red .dot { background: var(--red); box-shadow: 0 0 16px var(--red); }
    .overall .label { font-size: 1.1rem; font-weight: 500; }
    .overall .detail { color: var(--fg-muted); font-size: 0.9rem; }
    h2 { font-weight: 500; font-size: 1.1rem; margin: 2rem 0 0.6rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
    .tile {
      padding: 0.9rem 1rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--row-alt);
    }
    .tile .region { font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--fg-muted); }
    .tile .value { font-size: 1.4rem; font-weight: 500; margin: 0.2rem 0 0; }
    .tile .status { font-size: 0.8rem; margin-top: 0.3rem; }
    .tile.green .status { color: var(--green); }
    .tile.yellow .status { color: var(--yellow); }
    .tile.red .status { color: var(--red); }
    .tile.unknown .status { color: var(--fg-muted); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.4rem 1rem; }
    dl dt { color: var(--fg-muted); }
    dl dd { margin: 0; font-family: ui-monospace, monospace; font-size: 0.9rem; }
    footer {
      margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border);
      color: var(--fg-muted); font-size: 0.85rem;
    }
    footer a { color: var(--fg-muted); }
    code { font-family: ui-monospace, monospace; font-size: 0.85rem; }
    .updated { color: var(--fg-muted); font-size: 0.8rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>suwappu-devnet status</h1>
    <p class="subtitle">Real-time health of the public devnet. Updates every 5 seconds.</p>

    <div id="overall" class="overall">
      <div class="dot"></div>
      <div>
        <div class="label" id="overall-label">Loading…</div>
        <div class="detail" id="overall-detail">&nbsp;</div>
      </div>
    </div>

    <h2>Chain head</h2>
    <dl>
      <dt>Latest committed round</dt>  <dd id="tip-round">—</dd>
      <dt>Current epoch</dt>            <dd id="tip-epoch">—</dd>
      <dt>Last epoch boundary</dt>      <dd id="tip-bound">—</dd>
      <dt>Rounds per epoch</dt>         <dd id="tip-rpe">—</dd>
    </dl>

    <h2>Validators</h2>
    <div class="grid" id="validators"></div>

    <h2>Faucet</h2>
    <div class="grid" id="faucet"></div>

    <p class="updated">Last updated <span id="updated">never</span>.</p>

    <footer>
      <a href="https://github.com/Suwappu-Labs/suwappu-dag">suwappu-dag on GitHub</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/Suwappu-Labs/suwappu-dag/blob/main/DEVNET.md">DEVNET.md</a>
      &nbsp;·&nbsp;
      <a href="https://explorer.devnet.suwappu.bot">Block explorer</a>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
