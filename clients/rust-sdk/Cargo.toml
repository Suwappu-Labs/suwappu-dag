[package]
name = "suwappu-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Rust client SDK for the suwappu-dag JSON-RPC query API."

[dependencies]
# Share view types so an SDK consumer gets the same shape suwappu-node serves.
suwappu-rpc = { workspace = true }

# Use native-tls (default-tls) instead of rustls — matches what the
# rest of the workspace already pulls in via gsxdb-bridge → reqwest,
# avoids dragging in a second TLS stack with webpki-related advisories
# (RUSTSEC name-constraints family) that cargo-deny would reject.
reqwest = { version = "0.11", features = ["json"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

suwappu-execution = { workspace = true }
suwappu-crypto = { workspace = true }
blake3 = { workspace = true }
bincode = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axum = "0.7"
