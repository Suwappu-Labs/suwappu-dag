#cloud-config
#
# Bootstrap the suwappu-faucet HTTP service for the public testnet.
# Forked from terraform/devnet/faucet-cloud-init.yaml; only env
# vars + bucket / secret references differ.

package_update: true
package_upgrade: false
packages:
  - awscli
  - jq
  - amazon-cloudwatch-agent

write_files:
  - path: /etc/systemd/system/suwappu-faucet.service
    content: |
      [Unit]
      Description=SUWAPPU testnet faucet
      After=network-online.target suwappu-faucet-bootstrap.service
      Requires=suwappu-faucet-bootstrap.service

      [Service]
      Type=simple
      User=suwappu
      Group=suwappu
      Environment=RUST_LOG=suwappu_faucet=info,axum=warn
      Environment=SUWAPPU_FAUCET_RPC_URL=${rpc_url}
      Environment=SUWAPPU_FAUCET_NETWORK_ID=${network_id}
      Environment=SUWAPPU_FAUCET_SK_PATH=/var/lib/suwappu-faucet/mldsa.sk
      Environment=SUWAPPU_FAUCET_PK_PATH=/var/lib/suwappu-faucet/mldsa.pk
      Environment=SUWAPPU_FAUCET_BIND=0.0.0.0:8080
      ExecStart=/opt/suwappu/suwappu-faucet
      Restart=on-failure
      RestartSec=3
      StandardOutput=append:/var/log/suwappu-faucet/stdout.log
      StandardError=append:/var/log/suwappu-faucet/stderr.log

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/suwappu-faucet-bootstrap.service
    content: |
      [Unit]
      Description=Pull suwappu-faucet binary + keys
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/opt/suwappu/faucet-bootstrap.sh
      StandardOutput=append:/var/log/suwappu-faucet/bootstrap.log
      StandardError=append:/var/log/suwappu-faucet/bootstrap.log

  - path: /opt/suwappu/faucet-bootstrap.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      BUCKET="${artifact_bucket}"
      SECRET_ARN="${secret_arn}"
      mkdir -p /opt/suwappu /var/lib/suwappu-faucet /var/log/suwappu-faucet
      aws s3 cp "s3://$BUCKET/bin/suwappu-faucet" /opt/suwappu/suwappu-faucet
      chmod +x /opt/suwappu/suwappu-faucet
      aws s3 cp "s3://$BUCKET/keys/faucet/mldsa.pk" /var/lib/suwappu-faucet/mldsa.pk
      aws secretsmanager get-secret-value \
          --secret-id "$SECRET_ARN" \
          --query SecretBinary \
          --output text \
        | base64 -d > /var/lib/suwappu-faucet/mldsa.sk
      chmod 600 /var/lib/suwappu-faucet/mldsa.sk
      chown -R suwappu:suwappu /opt/suwappu /var/lib/suwappu-faucet /var/log/suwappu-faucet

runcmd:
  - groupadd --system suwappu
  - useradd --system --gid suwappu --no-create-home --shell /usr/sbin/nologin suwappu
  - mkdir -p /var/log/suwappu-faucet
  - chown suwappu:suwappu /var/log/suwappu-faucet
  - systemctl daemon-reload
  - systemctl enable suwappu-faucet-bootstrap.service suwappu-faucet.service
  - systemctl start suwappu-faucet-bootstrap.service
  - systemctl start suwappu-faucet.service
