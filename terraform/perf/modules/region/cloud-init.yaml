#cloud-config
#
# Bootstrap a GSX perf validator. Pulls the gsx-node binary from S3, writes
# a systemd unit, and starts the daemon. The node.toml itself is uploaded by
# scripts/perf/render-configs.sh after `terraform apply` (since peer IPs
# aren't known until the EIPs allocate).

package_update: true
package_upgrade: false
packages:
  - awscli
  - jq

write_files:
  - path: /etc/systemd/system/gsx-node.service
    content: |
      [Unit]
      Description=GSX DAG validator (perf testnet)
      After=network-online.target gsx-bootstrap.service
      Requires=gsx-bootstrap.service

      [Service]
      Type=simple
      User=gsx
      Group=gsx
      Environment=RUST_LOG=info
      ExecStart=/opt/gsx/gsx-node --config /etc/gsx/node.toml
      Restart=on-failure
      RestartSec=3
      StandardOutput=append:/var/log/gsx/stdout.log
      StandardError=append:/var/log/gsx/stderr.log

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/gsx-bootstrap.service
    content: |
      [Unit]
      Description=Pull GSX binaries + config from S3
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/opt/gsx/bootstrap.sh
      StandardOutput=append:/var/log/gsx/bootstrap.log
      StandardError=append:/var/log/gsx/bootstrap.log

  - path: /opt/gsx/bootstrap.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      BUCKET="${artifact_bucket}"
      REGION="${region_label}"
      AUTHORITY="${authority_id}"
      mkdir -p /opt/gsx /etc/gsx /var/lib/gsx /var/log/gsx
      # Pull binary + genesis + per-region node.toml.
      aws s3 cp "s3://$BUCKET/bin/gsx-node" /opt/gsx/gsx-node
      chmod +x /opt/gsx/gsx-node
      aws s3 cp "s3://$BUCKET/genesis/genesis.toml" /etc/gsx/genesis.toml
      aws s3 cp "s3://$BUCKET/configs/$REGION/node.toml" /etc/gsx/node.toml
      aws s3 cp "s3://$BUCKET/keys/$REGION/mldsa.sk" /var/lib/gsx/mldsa.sk
      aws s3 cp "s3://$BUCKET/keys/$REGION/bls.sk" /var/lib/gsx/bls.sk
      chmod 600 /var/lib/gsx/mldsa.sk /var/lib/gsx/bls.sk
      chown -R gsx:gsx /opt/gsx /etc/gsx /var/lib/gsx /var/log/gsx

runcmd:
  - groupadd --system gsx
  - useradd --system --gid gsx --no-create-home --shell /usr/sbin/nologin gsx
  - mkdir -p /var/log/gsx
  - chown gsx:gsx /var/log/gsx
  - systemctl daemon-reload
  - systemctl enable gsx-bootstrap.service gsx-node.service
  - systemctl start gsx-bootstrap.service
  - systemctl start gsx-node.service
