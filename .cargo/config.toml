# Cargo workspace configuration for gsx-dag.
#
# `net.git-fetch-with-cli = true` tells cargo to shell out to the
# system `git` binary for fetching, instead of libgit2. This is
# required because:
#
# - The workspace depends on private repos
#   (`Suwappu-Labs/suwappu-db`).
# - libgit2 inside cargo does NOT honour the `gh` credential helper or
#   most credential-store integrations on macOS / Linux.
# - The system `git` binary, configured by `gh auth login`, succeeds.
#
# CI runners get the same treatment: see `.github/workflows/ci.yml`
# which uses `webfactory/ssh-agent` to register the gsx-db deploy key
# before any cargo invocation.

[net]
git-fetch-with-cli = true
