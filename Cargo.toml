[workspace]
resolver = "2"
members = [
    "crates/gsx-crypto",
    "crates/gsx-consensus",
    "crates/gsx-authority",
    "crates/gsx-validator",
    "crates/gsx-fastpath",
    "crates/gsx-execution",
    "crates/gsx-precompiles",
    "crates/gsx-ltp",
    "crates/gsx-transport",
    "crates/gsx-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/GlobalSettlementNetwork/gsx-dag"
authors = ["Global Settlement Network <eng@globalsettlement.com>"]
# Workspace-internal crates. These are not published to crates.io; consuming
# code uses git/path dependencies on the repo. This also lets cargo-deny
# accept the workspace path wildcards under `[bans] allow-wildcard-paths`.
publish = false

[workspace.dependencies]
# External: gsx-db state substrate (paper §7.4)
gsxdb-bridge = { git = "https://github.com/GlobalSettlementNetwork/gsx-db.git", tag = "v0.1.0" }
gsxdb-state = { git = "https://github.com/GlobalSettlementNetwork/gsx-db.git", tag = "v0.1.0" }

# Internal
gsx-crypto = { path = "crates/gsx-crypto", default-features = false }
gsx-consensus = { path = "crates/gsx-consensus", default-features = false }
gsx-authority = { path = "crates/gsx-authority", default-features = false }
gsx-validator = { path = "crates/gsx-validator", default-features = false }
gsx-fastpath = { path = "crates/gsx-fastpath" }
gsx-execution = { path = "crates/gsx-execution" }
gsx-precompiles = { path = "crates/gsx-precompiles" }
gsx-ltp = { path = "crates/gsx-ltp" }
gsx-transport = { path = "crates/gsx-transport" }

# Post-quantum primitives (FIPS 203 / 204)
pqcrypto-mldsa = "0.1"
pqcrypto-mlkem = "0.1"
pqcrypto-traits = "0.3"

# Classical primitives (migration window per paper §12)
blst = "0.3"

# Hash + symmetric
sha3 = "0.10"
blake3 = "1.5"

# Erasure coding (RFC 6330) — gsx-transport block shred/reconstruct
raptorq = "2.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
toml = "0.8"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
futures = "0.3"

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Testing
proptest = "1.5"
rand = "0.8"
rand_chacha = "0.3"

# Transitive feature unlock for musl cross-compile: openssl-sys is pulled in
# by reqwest (via gsxdb-bridge). Without the `vendored` feature, openssl-sys
# fails on musl because there's no system OpenSSL with musl-compatible libs.
# Activating the workspace feature pins it on for every build.
openssl-sys = { version = "0.9", features = ["vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
