[workspace]
resolver = "2"
members = [
    "crates/gsx-crypto",
    "crates/gsx-consensus",
    "crates/gsx-authority",
    "crates/gsx-validator",
    "crates/gsx-fastpath",
    "crates/gsx-execution",
    "crates/gsx-precompiles",
    "crates/gsx-ltp",
    "crates/gsx-transport",
    "crates/gsx-node",
    "crates/gsx-rpc",
    "crates/gsx-indexer",
    "crates/gsx-mempool",
    "crates/gsx-faucet",
    "crates/gsx-validator-program",
    "crates/gsx-l2-verifier-precompile",
    "crates/gsx-l2-confidential",
    "crates/gsx-l2-bridge",
    "crates/gsx-l2-sequencer",
    "crates/gsx-l2-stm",
    "crates/gsx-l2-sequencer-daemon",
    "clients/rust-sdk",
]
# B4: keep the cargo-fuzz workspace out of the main one — cargo-fuzz
# uses its own nightly toolchain + libfuzzer-sys sanitizer flags
# that would force the whole workspace through nightly. Run via
# `cd fuzz && cargo +nightly fuzz run <target>`. See
# `docs/architecture/security.md` for the full procedure.
exclude = ["fuzz", "examples/rust", "crates/gsx-l2-stm/program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/GlobalSettlementNetwork/gsx-dag"
authors = ["Global Settlement Network <eng@globalsettlement.com>"]
# Workspace-internal crates. These are not published to crates.io; consuming
# code uses git/path dependencies on the repo. This also lets cargo-deny
# accept the workspace path wildcards under `[bans] allow-wildcard-paths`.
publish = false

[workspace.dependencies]
# External: gsx-db state substrate (paper §7.4)
gsxdb-bridge = { git = "https://github.com/GlobalSettlementNetwork/gsx-db.git", tag = "v0.1.0" }
gsxdb-state = { git = "https://github.com/GlobalSettlementNetwork/gsx-db.git", tag = "v0.1.0" }

# Internal
gsx-crypto = { path = "crates/gsx-crypto", default-features = false }
gsx-consensus = { path = "crates/gsx-consensus", default-features = false }
gsx-authority = { path = "crates/gsx-authority", default-features = false }
gsx-validator = { path = "crates/gsx-validator", default-features = false }
gsx-fastpath = { path = "crates/gsx-fastpath" }
gsx-execution = { path = "crates/gsx-execution" }
gsx-precompiles = { path = "crates/gsx-precompiles" }
gsx-ltp = { path = "crates/gsx-ltp" }
gsx-transport = { path = "crates/gsx-transport" }
gsx-rpc = { path = "crates/gsx-rpc" }
gsx-indexer = { path = "crates/gsx-indexer" }
gsx-mempool = { path = "crates/gsx-mempool" }
gsx-faucet = { path = "crates/gsx-faucet" }
gsx-validator-program = { path = "crates/gsx-validator-program" }
gsx-l2-verifier-precompile = { path = "crates/gsx-l2-verifier-precompile" }
gsx-l2-confidential = { path = "crates/gsx-l2-confidential" }
gsx-l2-bridge = { path = "crates/gsx-l2-bridge" }
gsx-l2-sequencer = { path = "crates/gsx-l2-sequencer" }
gsx-l2-stm = { path = "crates/gsx-l2-stm" }
gsx-l2-sequencer-daemon = { path = "crates/gsx-l2-sequencer-daemon" }
gsx-client = { path = "clients/rust-sdk" }

# Post-quantum primitives (FIPS 203 / 204)
pqcrypto-mldsa = "0.1"
pqcrypto-mlkem = "0.1"
pqcrypto-traits = "0.3"

# Classical primitives (migration window per paper §12)
blst = "0.3"

# Hash + symmetric
sha3 = "0.10"
blake3 = "1.5"
hkdf = "0.12"

# Erasure coding (RFC 6330) — gsx-transport block shred/reconstruct
raptorq = "2.0"

# SP1 Groth16 BN254 verifier (Track G G2.2 phase 2 — issue #97).
# Pulls in the BN254 pairing dep tree; isolated to
# `gsx-l2-verifier-precompile` so the rest of the workspace doesn't
# absorb its transitive deps. Verifier is `no_std`-compatible per
# Succinct's docs but we use std-friendly default features.
sp1-verifier = { version = "4", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde", "std"], default-features = false }
toml = "0.8"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
futures = "0.3"

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Testing
proptest = "1.5"
rand = "0.8"
rand_chacha = "0.3"

# Transitive feature unlock for musl cross-compile: openssl-sys is pulled in
# by reqwest (via gsxdb-bridge). Without the `vendored` feature, openssl-sys
# fails on musl because there's no system OpenSSL with musl-compatible libs.
# Activating the workspace feature pins it on for every build.
openssl-sys = { version = "0.9", features = ["vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
