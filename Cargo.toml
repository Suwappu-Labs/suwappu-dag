[workspace]
resolver = "2"
members = [
    "crates/suwappu-crypto",
    "crates/suwappu-consensus",
    "crates/suwappu-authority",
    "crates/suwappu-validator",
    "crates/suwappu-fastpath",
    "crates/suwappu-execution",
    "crates/suwappu-precompiles",
    "crates/suwappu-ltp",
    "crates/suwappu-transport",
    "crates/suwappu-node",
    "crates/suwappu-rpc",
    "crates/suwappu-indexer",
    "crates/suwappu-mempool",
    "crates/suwappu-faucet",
    "crates/suwappu-validator-program",
    "crates/suwappu-l2-verifier-precompile",
    "crates/suwappu-l2-confidential",
    "crates/suwappu-l2-bridge",
    "crates/suwappu-l2-sequencer",
    "crates/suwappu-mldsa-precompile",
    "clients/rust-sdk",
]
# B4: keep the cargo-fuzz workspace out of the main one — cargo-fuzz
# uses its own nightly toolchain + libfuzzer-sys sanitizer flags
# that would force the whole workspace through nightly. Run via
# `cd fuzz && cargo +nightly fuzz run <target>`. See
# `docs/architecture/security.md` for the full procedure.
#
# zkvm/*: SP1 zkVM guest crates compile for a special RISC-V target via
# `cargo prove build` (a separate toolchain, "+succinct" — see
# zkvm/README.md), and the host crate pulls in sp1-sdk's heavy dep tree.
# Neither belongs in the main workspace's default `cargo build`/`test`.
exclude = ["fuzz", "examples/rust", "zkvm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/Suwappu-Labs/suwappu-dag"
authors = ["Suwappu Labs <eng@suwappu.bot>"]
# Workspace-internal crates. These are not published to crates.io; consuming
# code uses git/path dependencies on the repo. This also lets cargo-deny
# accept the workspace path wildcards under `[bans] allow-wildcard-paths`.
publish = false

[workspace.dependencies]
# External: suwappu-db state substrate (paper §7.4)
suwappudb-bridge = { git = "https://github.com/Suwappu-Labs/suwappu-db.git", tag = "v0.6.0" }
suwappudb-state = { git = "https://github.com/Suwappu-Labs/suwappu-db.git", tag = "v0.6.0" }

# Internal
suwappu-crypto = { path = "crates/suwappu-crypto", default-features = false }
suwappu-consensus = { path = "crates/suwappu-consensus", default-features = false }
suwappu-authority = { path = "crates/suwappu-authority", default-features = false }
suwappu-validator = { path = "crates/suwappu-validator", default-features = false }
suwappu-fastpath = { path = "crates/suwappu-fastpath" }
suwappu-execution = { path = "crates/suwappu-execution" }
suwappu-precompiles = { path = "crates/suwappu-precompiles" }
suwappu-ltp = { path = "crates/suwappu-ltp" }
suwappu-transport = { path = "crates/suwappu-transport" }
suwappu-rpc = { path = "crates/suwappu-rpc" }
suwappu-indexer = { path = "crates/suwappu-indexer" }
suwappu-mempool = { path = "crates/suwappu-mempool" }
suwappu-faucet = { path = "crates/suwappu-faucet" }
suwappu-validator-program = { path = "crates/suwappu-validator-program" }
suwappu-l2-verifier-precompile = { path = "crates/suwappu-l2-verifier-precompile" }
suwappu-l2-confidential = { path = "crates/suwappu-l2-confidential" }
suwappu-l2-bridge = { path = "crates/suwappu-l2-bridge" }
suwappu-l2-sequencer = { path = "crates/suwappu-l2-sequencer" }
suwappu-client = { path = "clients/rust-sdk" }

# Post-quantum primitives (FIPS 203 / 204)
pqcrypto-mldsa = "0.1"
pqcrypto-mlkem = "0.1"
pqcrypto-traits = "0.3"

# Classical primitives (migration window per paper §12)
blst = "0.3"

# Hash + symmetric
sha3 = "0.10"
blake3 = "1.5"
hkdf = "0.12"

# Erasure coding (RFC 6330) — suwappu-transport block shred/reconstruct
raptorq = "2.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde", "std"], default-features = false }
toml = "0.8"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
futures = "0.3"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Testing
proptest = "1.5"
rand = "0.10"
rand_chacha = "0.3"

# Transitive feature unlock for musl cross-compile: openssl-sys is pulled in
# by reqwest (via suwappudb-bridge). Without the `vendored` feature, openssl-sys
# fails on musl because there's no system OpenSSL with musl-compatible libs.
# Activating the workspace feature pins it on for every build.
openssl-sys = { version = "0.9", features = ["vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
